<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GWCA House Point System</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fjalla+One&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
  :root{
    --navy:#0B1F3A; --navy-light:#132a4d; --orange:#E8722C; --orange-dark:#c95d1c;
    --white:#ffffff; --paper:#F7F8FA; --ink:#132133; --muted:#6B7686; --line:#E4E8EF;
    --green:#2E7D32; --red:#C62828; --gold:#C99A1B; --blue:#1565C0;
    --radius:14px;
  }
  *{box-sizing:border-box;}
  body{margin:0;font-family:'Inter',sans-serif;background:var(--paper);color:var(--ink);}
  h1,h2,h3,.display{font-family:'Fjalla One',sans-serif;letter-spacing:.02em;}
  #app{min-height:100vh;display:flex;flex-direction:column;padding-bottom:72px;}

  /* Header / crest bar */
  .topbar{background:linear-gradient(135deg,var(--navy) 0%,var(--navy-light) 100%);color:#fff;padding:14px 18px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:20;box-shadow:0 2px 10px rgba(11,31,58,.25);}
  .brand{display:flex;align-items:center;gap:10px;}
  .lion{width:38px;height:38px;border-radius:50%;background:var(--orange);display:flex;align-items:center;justify-content:center;font-size:20px;flex-shrink:0;}
  .brand-text .display{font-size:18px;margin:0;line-height:1.1;}
  .brand-text small{color:#B9C6DC;font-size:11px;letter-spacing:.12em;text-transform:uppercase;}
  .role-select{background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.25);color:#fff;border-radius:8px;padding:7px 10px;font-size:12px;font-family:inherit;}
  .role-select option{color:#111;}

  /* Nav */
  nav.desktop-nav{display:none;}
  nav.mobile-nav{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid var(--line);display:flex;z-index:30;box-shadow:0 -4px 14px rgba(0,0,0,.06);}
  nav.mobile-nav button{flex:1;border:none;background:none;padding:9px 2px 8px;font-family:inherit;font-size:10px;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:3px;}
  nav.mobile-nav button.active{color:var(--orange-dark);font-weight:700;}
  nav.mobile-nav .ic{font-size:19px;}

  @media(min-width:880px){
    nav.mobile-nav{display:none;}
    nav.desktop-nav{display:flex;flex-direction:column;position:fixed;top:66px;left:0;bottom:0;width:200px;background:var(--navy);padding:16px 12px;gap:3px;z-index:15;overflow-y:auto;}
    nav.desktop-nav button{background:none;border:none;color:#CFE0F5;text-align:left;padding:11px 12px;border-radius:9px;font-family:inherit;font-size:13.5px;font-weight:700;cursor:pointer;display:flex;align-items:center;gap:10px;}
    nav.desktop-nav button.active{background:rgba(255,255,255,.14);color:#fff;}
    nav.desktop-nav .ic{font-size:16px;width:20px;text-align:center;}
    #app{padding-bottom:0;}
    main{margin-left:200px;max-width:1000px;}
  }

  main{flex:1;padding:16px;max-width:960px;width:100%;margin:0 auto;}

  .card{background:#fff;border:1px solid var(--line);border-radius:var(--radius);padding:16px;margin-bottom:14px;}
  .card h2{margin:0 0 10px;font-size:17px;color:var(--navy);}
  .grid{display:grid;gap:12px;}
  .grid-2{grid-template-columns:repeat(2,1fr);}
  .grid-3{grid-template-columns:repeat(3,1fr);}
  @media(min-width:640px){ .grid-4{grid-template-columns:repeat(4,1fr);} }
  @media(max-width:639px){ .grid-3,.grid-4{grid-template-columns:repeat(2,1fr);} }

  .stat{background:#fff;border:1px solid var(--line);border-radius:var(--radius);padding:14px;text-align:left;}
  .stat .num{font-family:'Fjalla One';font-size:26px;color:var(--navy);}
  .stat .lbl{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;margin-top:2px;}

  .btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:none;border-radius:10px;padding:12px 16px;font-family:inherit;font-weight:700;font-size:14px;cursor:pointer;}
  .btn-primary{background:var(--orange);color:#fff;}
  .btn-primary:active{background:var(--orange-dark);}
  .btn-navy{background:var(--navy);color:#fff;}
  .btn-outline{background:#fff;border:1.5px solid var(--line);color:var(--ink);}
  .btn-danger{background:#fff;border:1.5px solid #F1B4B4;color:var(--red);}
  .btn-block{width:100%;}
  .btn-lg{padding:16px;font-size:16px;border-radius:12px;}
  .btn:disabled{opacity:.4;cursor:not-allowed;}

  input[type=text],input[type=number],select,textarea{width:100%;border:1.5px solid var(--line);border-radius:10px;padding:11px 12px;font-family:inherit;font-size:14px;background:#fff;}
  input:focus,select:focus,textarea:focus{outline:2px solid var(--orange);outline-offset:1px;}
  label{font-size:11px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);font-weight:700;display:block;margin-bottom:6px;}

  .house-chip{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:20px;font-size:12px;font-weight:700;color:#fff;}
  .house-crest{width:46px;height:46px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:22px;color:#fff;flex-shrink:0;}

  .scholar-card{display:flex;gap:14px;align-items:center;}
  .avatar{width:64px;height:64px;border-radius:50%;background:var(--navy);color:#fff;display:flex;align-items:center;justify-content:center;font-family:'Fjalla One';font-size:22px;flex-shrink:0;}

  .bar-row{display:flex;align-items:center;gap:10px;margin-bottom:10px;}
  .bar-track{flex:1;height:14px;background:#EEF1F6;border-radius:8px;overflow:hidden;}
  .bar-fill{height:100%;border-radius:8px;}

  table{width:100%;border-collapse:collapse;font-size:13px;}
  th{text-align:left;color:var(--muted);text-transform:uppercase;font-size:10px;letter-spacing:.06em;padding:8px 6px;border-bottom:2px solid var(--line);}
  td{padding:9px 6px;border-bottom:1px solid var(--line);}
  .pill-pos{color:var(--green);font-weight:700;}
  .pill-neg{color:var(--red);font-weight:700;}

  .chip-row{display:flex;flex-wrap:wrap;gap:8px;}
  .chip{border:1.5px solid var(--line);background:#fff;border-radius:10px;padding:10px 14px;font-weight:700;cursor:pointer;font-family:inherit;font-size:14px;}
  .chip.selected{border-color:var(--orange);background:#FFF1E8;color:var(--orange-dark);}
  .chip-cat{border:1.5px solid var(--line);background:#fff;border-radius:10px;padding:9px 12px;cursor:pointer;text-align:left;font-family:inherit;font-size:13px;}
  .chip-cat.selected{border-color:var(--navy);background:#EEF2F8;}
  .toast{position:fixed;top:14px;left:50%;transform:translateX(-50%);background:var(--navy);color:#fff;padding:12px 20px;border-radius:10px;z-index:100;font-weight:600;box-shadow:0 6px 20px rgba(0,0,0,.25);}
  .empty{color:var(--muted);font-size:13px;text-align:center;padding:24px 8px;}
  .badge-dot{width:9px;height:9px;border-radius:50%;display:inline-block;margin-right:5px;}
  .subtle{color:var(--muted);font-size:12px;}
  video#camview,video#globalCamview{width:100%;border-radius:12px;background:#000;}

  .gnav-actions{display:flex;gap:6px;}
  .gnav-btn{background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.28);color:#fff;border-radius:9px;padding:9px 11px;font-size:15px;cursor:pointer;display:flex;align-items:center;gap:5px;font-family:inherit;font-weight:700;}
  .gnav-btn span.lbl{font-size:11px;display:none;}
  @media(min-width:560px){ .gnav-btn span.lbl{display:inline;} }
  .modal-backdrop{position:fixed;inset:0;background:rgba(11,31,58,.6);z-index:200;display:flex;align-items:flex-start;justify-content:center;padding:14px;overflow-y:auto;}
  .modal-box{background:#fff;border-radius:16px;max-width:520px;width:100%;margin-top:36px;position:relative;box-shadow:0 20px 50px rgba(0,0,0,.35);}
  .modal-close{position:absolute;top:10px;right:10px;background:#EEF1F6;border:none;border-radius:50%;width:34px;height:34px;font-size:16px;cursor:pointer;z-index:2;}
  .modal-inner{padding:20px;}
</style>
</head>

function findByBarcode(code){
  const q = code.trim().toLowerCase();
  return SCHOLARS.find(s=> (s.barcodeId||'').toLowerCase()===q || (s.studentId||'').toLowerCase()===q);
}
function searchScholars(q){
  q=q.trim().toLowerCase();
  if(!q) return [];
  return SCHOLARS.filter(s=>
    fullName(s).toLowerCase().includes(q) ||
    (s.studentId||'').toLowerCase().includes(q) ||
    (s.barcodeId||'').toLowerCase().includes(q) ||
    (s.grade||'').toLowerCase()===q ||
    (s.homeroom||'').toLowerCase().includes(q) ||
    houseById(s.houseId).name.toLowerCase().includes(q)
  ).slice(0,25);
}
/* ---- Roster import (CSV / Excel via SheetJS) ---- */
function normalizeHeaderKey(k){ return String(k).trim().toLowerCase().replace(/\s+/g,' '); }
function rowGet(rowNormalized, aliases){
  for(const a of aliases){ const v = rowNormalized[a]; if(v!==undefined && v!==null && String(v).trim()!=='') return String(v).trim(); }
  return null;
}
function importRowsToScholars(rows){
  const houseNameToId = {msaada:'msaada',uzwelo:'uzwelo',juriya:'juriya',ideas:'ideas',iyege:'iyege'};
  const out=[]; const seen={};
  rows.forEach((raw,i)=>{
    const row={}; Object.keys(raw||{}).forEach(k=> row[normalizeHeaderKey(k)] = raw[k]);
    const barcode = rowGet(row,['barcode id','barcode']);
    const studentId = rowGet(row,['student id']);
    const first = rowGet(row,['first name']) || '';
    const last = rowGet(row,['last name']) || '';
    if(!first && !last) return; // skip blank rows
    const grade = rowGet(row,['grade']) || '';
    const homeroom = rowGet(row,['teacher name','homeroom teacher','homeroom']) || '';
    const houseRaw = rowGet(row,['house']);
    const houseId = houseRaw ? (houseNameToId[houseRaw.toLowerCase()] || null) : null;
    const currentPoints = parseInt(rowGet(row,['current points'])) || 0;
    const lifetimePoints = parseInt(rowGet(row,['lifetime points'])) || 0;
    const rewardBalance = parseInt(rowGet(row,['store rewards balance','reward balance'])) || 0;
    const status = (rowGet(row,['status']) || 'active').toLowerCase();
    const notes = rowGet(row,['notes']) || '';
    const parentName = rowGet(row,['parent name']);
    const parentEmail = rowGet(row,['parent email']);
    const parentPhone = rowGet(row,['parent phone']);
    const base = studentId || barcode || ('ROW'+i);
    let id = 'S' + String(base).replace(/[^A-Za-z0-9]/g,'');
    if(seen[id]) id = id+'_'+i;
    seen[id]=true;
    out.push({id, studentId, barcodeId:barcode, first, last, grade, homeroom, houseId,
      currentPoints, lifetimePoints, rewardBalance, status, notes, parentName, parentEmail, parentPhone, lastScan:null});
  });
  return out;
}

function houseTotals(){
  const totals={}; HOUSES.forEach(h=>totals[h.id]=0);
  SCHOLARS.forEach(s=> totals[s.houseId]+=s.currentPoints);
  return totals;
}
function todayStats(){
  const today=new Date().toDateString();
  let added=0, deducted=0;
  TRANSACTIONS.filter(t=> new Date(t.ts).toDateString()===today).forEach(t=>{
    if(t.dir==='positive') added+=t.amount; else deducted+=Math.abs(t.amount);
  });
  return {added,deducted};
}
function applyTransaction(scholar, categoryObj, amount, note){
  const dir = amount>=0 ? 'positive':'negative';
  const newCurrent = Math.max(0, scholar.currentPoints + amount);
  const newLifetime = Math.max(0, scholar.lifetimePoints + Math.max(0,amount));
  const newReward = Math.max(0, scholar.rewardBalance + amount);
  const tx = {id:uid('T'), scholarId:scholar.id, houseId:scholar.houseId, amount, dir,
    category:categoryObj.name, staffRole:state.role, note, ts:Date.now()};
  if(FIREBASE_ENABLED){
    db.collection('scholars').doc(scholar.id).update({
      currentPoints:newCurrent, lifetimePoints:newLifetime, rewardBalance:newReward, lastScan:tx.ts
    }).catch(err=>toast('⚠ Sync error: '+err.message));
    db.collection('transactions').doc(tx.id).set(tx).catch(err=>toast('⚠ Sync error: '+err.message));
    // Optimistically update local copy so the UI feels instant; the live listener will confirm it.
    scholar.currentPoints=newCurrent; scholar.lifetimePoints=newLifetime; scholar.rewardBalance=newReward; scholar.lastScan=tx.ts;
    TRANSACTIONS.unshift(tx);
  } else {
    scholar.currentPoints=newCurrent; scholar.lifetimePoints=newLifetime; scholar.rewardBalance=newReward; scholar.lastScan=tx.ts;
    TRANSACTIONS.unshift(tx);
  }
  return tx;
}
function badgesFor(s){
  const b=[];
  [25,50,100,250,500].forEach(t=>{ if(s.lifetimePoints>=t) b.push(t+' Point Club'); });
  return b;
}

function exportTxStats(s){
  const txs=TRANSACTIONS.filter(t=>t.scholarId===s.id);
  let positive=0, negative=0;
  txs.forEach(t=>{ if(Number(t.amount)>0) positive+=Number(t.amount); else negative+=Math.abs(Number(t.amount)||0); });
  const newest=txs.slice().sort((a,b)=>Number(b.ts||0)-Number(a.ts||0))[0];
  return {positive, negative, count:txs.length, last:newest&&newest.ts?new Date(newest.ts).toLocaleString():''};
}
function exportUnique(field){
  return [...new Set(SCHOLARS.map(s=>String(s[field]||'').trim()).filter(Boolean))].sort((a,b)=>a.localeCompare(b,undefined,{numeric:true}));
}
function getExportScholars(){
  const f=state.exportFilters;
  let rows=SCHOLARS.filter(s=>{
    if(f.house!=='all' && (f.house==='unsorted' ? !!s.houseId : s.houseId!==f.house)) return false;
    if(f.grade!=='all' && String(s.grade||'')!==f.grade) return false;
    if(f.homeroom!=='all' && String(s.homeroom||'')!==f.homeroom) return false;
    if(f.status!=='all' && String(s.status||'').toLowerCase()!==f.status) return false;
    if(f.minPoints!=='' && Number(s.currentPoints||0)<Number(f.minPoints)) return false;
    if(f.maxPoints!=='' && Number(s.currentPoints||0)>Number(f.maxPoints)) return false;
    const st=exportTxStats(s);
    if(f.special==='zero' && Number(s.currentPoints||0)!==0) return false;
    if(f.special==='deductions' && st.negative<=0) return false;
    if(f.special==='missing_house' && !!s.houseId) return false;
    if(f.special==='reward_ready' && Number(s.rewardBalance||0)<20) return false;
    return true;
  });
  const sorters={
    last:(a,b)=>(a.last||'').localeCompare(b.last||''),
    first:(a,b)=>(a.first||'').localeCompare(b.first||''),
    grade:(a,b)=>String(a.grade||'').localeCompare(String(b.grade||''),undefined,{numeric:true}) || (a.last||'').localeCompare(b.last||''),
    house:(a,b)=>houseById(a.houseId).name.localeCompare(houseById(b.houseId).name) || (a.last||'').localeCompare(b.last||''),
    homeroom:(a,b)=>String(a.homeroom||'').localeCompare(String(b.homeroom||'')) || (a.last||'').localeCompare(b.last||''),
    points_desc:(a,b)=>Number(b.currentPoints||0)-Number(a.currentPoints||0),
    points_asc:(a,b)=>Number(a.currentPoints||0)-Number(b.currentPoints||0)
  };
  rows.sort(sorters[f.sort]||sorters.last);
  if(state.exportLimit) rows=rows.slice(0,state.exportLimit);
  if(state.exportSelectionMode && state.exportSelectedIds.length){
    const picked=new Set(state.exportSelectedIds);
    rows=rows.filter(s=>picked.has(s.id));
  }
  return rows;
}
function exportChosenColumns(){
  const picked=new Set(state.exportColumns);

function exportDataRows(){

        oninput="App.setGlobalScanInput(this.value)"

      <div style="margin-top:10px;display:flex;gap:8px;">
        <button class="btn btn-outline" onclick="App.submitGlobalScan(document.getElementById('globalBarcodeInput').value)">Look Up</button>
        <button class="btn btn-navy" onclick="App.toggleGlobalCamera()">${state.globalCamOpen?'Close Camera':'📷 Scan with Camera'}</button>
      </div>
      ${state.globalCamOpen?`<div style="margin-top:12px;"><video id="globalCamview" autoplay playsinline></video><div class="subtle" style="margin-top:6px;">Point the camera at the barcode.</div></div>`:''}
    `;
  } else if(state.globalPanel==='scholar'){
    inner = renderScholarPanel();
  }
  return `<div class="modal-backdrop" onmousedown="if(event.target===this){App.closeGlobalModal()}">
    <div class="modal-box">
      <button class="modal-close" onclick="App.closeGlobalModal()">✕</button>
      <div class="modal-inner">${inner}</div>
    </div>
  </div>`;
}

/* ============================= MAIN RENDER ============================= */
function render(){
  if(FIREBASE_ENABLED && !state.authUser){
    document.getElementById('app').innerHTML = renderLoginScreen();
    return;
  }
  let body='';
  switch(state.tab){
    case 'dashboard': body = state.role==='student' ? viewScanSearch('scan') : viewDashboard(); break;
    case 'scan': body = viewScanSearch('scan'); break;
    case 'search': body = viewScanSearch('search'); break;
    case 'leaderboard': body = viewLeaderboard(); break;
    case 'houses': body = viewHouses(); break;
    case 'rewards': body = viewRewards(); break;
    case 'history': body = viewHistory(); break;
    case 'rulebook': body = viewRulebook(); break;
    case 'export': body = isAdmin() ? viewExport() : '<div class="empty">Admin access required.</div>'; break;
    case 'manage': body = isAdmin() ? viewManage() : '<div class="empty">Admin access required.</div>'; break;
    default: body = viewDashboard();
  }
  document.getElementById('app').innerHTML = `
    ${renderTopbar()}
    ${renderDesktopNav()}
    <main>${body}</main>
    ${renderMobileNav()}
    ${state.toast?`<div class="toast">${state.toast}</div>`:''}
    ${renderGlobalModal()}
    ${renderMoreMenu()}
  `;
  if(state.camOpen) startCamera('camview');
  if(state.globalCamOpen) startCamera('globalCamview');
}

/* ============================= APP ACTIONS ============================= */
window.App = {
  setRole(v){ state.role=v; state.tab = v==='student' ? 'scan' : 'dashboard'; state.selectedScholarId=null; render(); },
  setLoginEmail(v){ state.loginEmail=v; },
  setLoginPassword(v){ state.loginPassword=v; },
  login(){
    if(!FIREBASE_ENABLED) return;
    state.authError=null; state.authBusy=true; render();
    firebase.auth().signInWithEmailAndPassword(state.loginEmail.trim(), state.loginPassword)
      .catch(err=>{
        state.authBusy=false;
        state.authError = err.code==='auth/invalid-credential' || err.code==='auth/wrong-password' || err.code==='auth/user-not-found'
          ? 'Incorrect email or password.' : (err.message || 'Sign-in failed.');
        render();
      });
  },
  logout(){
    if(!FIREBASE_ENABLED) return;
    firebase.auth().signOut();
  },
  setTab(t){ state.tab=t; state.selectedScholarId=null; state.entry={mode:null,category:null,custom:null,note:'',error:null}; state.camOpen=false; state.globalPanel=null; state.globalCamOpen=false; state.moreMenuOpen=false; stopCamera(); render(); },
  toggleMoreMenu(){ state.moreMenuOpen=!state.moreMenuOpen; render(); },
  setScanInput(v){ state.scanInput=v; },
  setSearchQuery(v){ state.searchQuery=v; render();
    setTimeout(()=>{ const el=document.getElementById('searchQueryInput'); if(el){ el.focus(); el.selectionStart=el.selectionEnd=el.value.length; } },0); },
  submitScan(code){
    if(!code || !code.trim()){ return; }
    const s = findByBarcode(code);
    if(!s){ toast('⚠ Barcode not found: '+code); state.scanInput=''; render(); return; }
    if(s.status!=='active'){ toast('⚠ '+fullName(s)+' is marked inactive.'); state.scanInput=''; render(); return; }
    state.selectedScholarId = s.id; state.scanInput=''; state.camOpen=false; render();
    setTimeout(()=>{ const el=document.getElementById('barcodeInput'); if(el) el.focus(); },50);
  },
  selectScholar(id){ state.selectedScholarId=id; render(); },
  startEntry(id,mode){ state.selectedScholarId=id; state.entry={mode,category:null,custom:null,note:'',error:null}; render(); },
  cancelEntry(){ state.entry={mode:null,category:null,custom:null,note:'',error:null}; render(); },
  setAmount(n){ state.entry.custom=n; state.entry.error=null; render(); },
  setCustomAmount(v){ state.entry.customValue=parseInt(v)||0; },
  setCategory(name){ state.entry.category=name; state.entry.error=null; render(); },
  setNote(v){ state.entry.note=v; },
  saveEntry(scholarId){
    const s = SCHOLARS.find(x=>x.id===scholarId);
    const e = state.entry;
    let amt = e.custom==='custom' ? (e.customValue||0) : e.custom;
    if(!amt){ e.error='Pick a point amount above before saving.'; render(); return; }
    if(!e.category){ e.error='Choose a reason above before saving.'; render(); return; }
    if(e.mode==='negative' && !e.note.trim()){ e.error='A note is required for deductions — add one below before saving.'; render(); return; }
    e.error=null;
    const signedAmt = e.mode==='negative' ? -Math.abs(amt) : Math.abs(amt);
    const catObj = {name:e.category};
    const before = s.currentPoints;
    applyTransaction(s, catObj, signedAmt, e.note);
    const actualChange = s.currentPoints - before;
    if(actualChange !== signedAmt && signedAmt<0){
      toast('Saved — floored at 0 (only '+actualChange+' could be removed, scholar had '+before+').');
    } else {
      toast((signedAmt>0?'+':'')+signedAmt+' points saved for '+fullName(s)+'! Now at '+s.currentPoints+'.');
    }
    state.entry={mode:null,category:null,custom:null,note:'',error:null};
    render();
  },
  toggleHideNames(){ state.hideLastNames=!state.hideLastNames; render(); },
  clearScholarForRewards(){ state.selectedScholarId=null; state.searchQuery=''; render(); },
  pickScholarForRewards(id){ state.selectedScholarId=id; state.searchQuery=''; render(); },
  redeem(name,cost){
    const s = SCHOLARS.find(x=>x.id===state.selectedScholarId);
    if(!s || s.rewardBalance<cost){ toast('Not enough points for that reward.'); return; }
    const newBalance = s.rewardBalance - cost;
    const red = {id:uid('R'), scholarId:s.id, reward:name, ts:Date.now()};
    if(FIREBASE_ENABLED){
      db.collection('scholars').doc(s.id).update({rewardBalance:newBalance}).catch(err=>toast('⚠ Sync error: '+err.message));
      db.collection('redemptions').doc(red.id).set(red).catch(()=>{});
    }
    s.rewardBalance = newBalance;
    REDEMPTIONS.unshift(red);
    toast('🎉 '+name+' redeemed for '+fullName(s)+'!');
    render();
  },
  toggleCamera(){ state.camOpen=!state.camOpen; if(!state.camOpen) stopCamera(); render(); },
  openGlobalSearch(){ state.globalPanel='search'; state.globalSearchQuery=''; render();
    setTimeout(()=>{ const el=document.getElementById('globalSearchInput'); if(el) el.focus(); },50); },
  openGlobalScan(){ state.globalPanel='scan'; state.globalScanInput=''; state.globalCamOpen=false; render();
    setTimeout(()=>{ const el=document.getElementById('globalBarcodeInput'); if(el) el.focus(); },50); },
  setGlobalSearch(v){ state.globalSearchQuery=v; render();
    setTimeout(()=>{ const el=document.getElementById('globalSearchInput'); if(el){ el.focus(); el.selectionStart=el.selectionEnd=el.value.length; } },0); },
  setGlobalScanInput(v){ state.globalScanInput=v; },
  submitGlobalScan(code){
    if(!code || !code.trim()) return;
    const s = findByBarcode(code);
    if(!s){ toast('⚠ Barcode not found: '+code); state.globalScanInput=''; render(); return; }
    if(s.status!=='active'){ toast('⚠ '+fullName(s)+' is marked inactive.'); state.globalScanInput=''; render(); return; }
    App.openScholarModal(s.id);
  },
  openScholarModal(id){
    state.selectedScholarId=id; state.globalPanel='scholar';
    state.entry={mode:null,category:null,custom:null,note:'',error:null};
    if(state.globalCamOpen){ state.globalCamOpen=false; stopCamera(); }
    render();
  },
  closeGlobalModal(){ state.globalPanel=null; state.globalCamOpen=false; stopCamera(); render(); },
  toggleGlobalCamera(){ state.globalCamOpen=!state.globalCamOpen; if(!state.globalCamOpen) stopCamera(); render(); },
  setExportFilter(key,value){ state.exportFilters[key]=value; state.exportLimit=null; state.exportSelectedIds=[]; render(); },
  clearExportFilters(){ state.exportFilters={house:'all',grade:'all',homeroom:'all',status:'all',minPoints:'',maxPoints:'',special:'all',sort:'last'}; state.exportLimit=null; state.exportSelectedIds=[]; render(); },
  exportPreset(preset){
    state.exportFilters={house:'all',grade:'all',homeroom:'all',status:'all',minPoints:'',maxPoints:'',special:'all',sort:'last'};
    state.exportSelectionMode=false; state.exportSelectedIds=[]; state.exportLimit=null;
    if(preset==='top25'){ state.exportFilters.sort='points_desc'; state.exportLimit=25; }
    if(preset==='zero') state.exportFilters.special='zero';
    if(preset==='deductions') state.exportFilters.special='deductions';
    if(preset==='reward_ready') state.exportFilters.special='reward_ready';
    if(preset==='missing_house') state.exportFilters.special='missing_house';
    if(preset==='barcode') state.exportColumns=['studentId','barcodeId','first','last','grade','homeroom','house'];
    else if(preset==='all') state.exportColumns=['studentId','barcodeId','first','last','grade','homeroom','house','currentPoints','lifetimePoints','rewardBalance','status'];
    render();
  },
  toggleExportColumn(id,checked){
    const set=new Set(state.exportColumns); checked?set.add(id):set.delete(id); state.exportColumns=[...set]; render();
  },
  exportSelectAllColumns(){ state.exportColumns=EXPORT_COLUMNS.map(c=>c.id); render(); },
  exportDefaultColumns(){ state.exportColumns=['studentId','barcodeId','first','last','grade','homeroom','house','currentPoints','lifetimePoints','rewardBalance','status']; render(); },
  toggleExportSelectionMode(checked){ state.exportSelectionMode=checked; if(!checked) state.exportSelectedIds=[]; render(); },
  toggleExportScholar(id,checked){ const set=new Set(state.exportSelectedIds); checked?set.add(id):set.delete(id); state.exportSelectedIds=[...set]; render(); },
  selectAllExportScholars(){
    const prior=state.exportSelectionMode; state.exportSelectionMode=false; const ids=getExportScholars().map(s=>s.id); state.exportSelectionMode=prior; state.exportSelectedIds=ids; render();
  },
  clearExportSelection(){ state.exportSelectedIds=[]; render(); },
  exportExcel(){
    let rows=exportDataRows();
    if(state.exportFilters.sort==='points_desc' && state.exportFilters.special==='all' && rows.length>25 && false) rows=rows.slice(0,25);
    if(!rows.length){ toast('No scholars to export.'); return; }
    const ws=XLSX.utils.json_to_sheet(rows); const wb=XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb,ws,'Scholars');
    ws['!cols']=Object.keys(rows[0]).map(k=>({wch:Math.min(32,Math.max(12,k.length+2))}));
    XLSX.writeFile(wb,safeExportFilename('Scholar_Export','xlsx'));
    toast('✔ Excel export created.');
  },
  exportCSV(){
    const rows=exportDataRows(); if(!rows.length){ toast('No scholars to export.'); return; }
    const headers=Object.keys(rows[0]);
    const csv=[headers.map(exportCsvEscape).join(','),...rows.map(r=>headers.map(h=>exportCsvEscape(r[h])).join(','))].join('\r\n');
    const blob=new Blob(['\ufeff'+csv],{type:'text/csv;charset=utf-8;'}); const a=document.createElement('a');
    a.href=URL.createObjectURL(blob); a.download=safeExportFilename('Scholar_Export','csv'); document.body.appendChild(a); a.click(); a.remove(); setTimeout(()=>URL.revokeObjectURL(a.href),500);
    toast('✔ CSV export created.');
  },
  exportPrint(pdfMode){
    const rows=exportDataRows(); if(!rows.length){ toast('No scholars to export.'); return; }
    const headers=Object.keys(rows[0]); const title='GWCA Scholar Export';
    const win=window.open('','_blank'); if(!win){ toast('Please allow pop-ups to print the report.'); return; }
    const esc=v=>String(v??'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
    win.document.write(`<!doctype html><html><head><title>${title}</title><style>body{font-family:Arial,sans-serif;margin:24px;color:#132133}h1{color:#0B1F3A;margin:0}p{color:#667085}table{width:100%;border-collapse:collapse;font-size:10px}th{background:#0B1F3A;color:white;text-align:left;padding:7px}td{padding:6px;border-bottom:1px solid #ddd;vertical-align:top}@media print{body{margin:.3in}button{display:none}} </style></head><body><h1>${title}</h1><p>George Washington Carver Academy · ${rows.length} scholar${rows.length===1?'':'s'} · Generated ${new Date().toLocaleString()}</p>${pdfMode?'<p><strong>To save this report:</strong> choose Print, then select <em>Save as PDF</em> as the destination.</p>':''}<button onclick="window.print()" style="padding:9px 14px;margin-bottom:12px">Print / Save PDF</button><table><thead><tr>${headers.map(h=>`<th>${esc(h)}</th>`).join('')}</tr></thead><tbody>${rows.map(r=>`<tr>${headers.map(h=>`<td>${esc(r[h])}</td>`).join('')}</tr>`).join('')}</tbody></table></body></html>`);
    win.document.close(); win.focus(); setTimeout(()=>win.print(),250);
  },
  setHouseImage(houseId, file){
    if(!file) return;
    if(file.size > 800*1024){ toast('⚠ That image is large — try one under ~500KB for faster loading.'); }
    const reader = new FileReader();
    reader.onload = (e)=>{
      const dataUrl = e.target.result;
      const h = houseById(houseId);
      h.crestImage = dataUrl;
      if(FIREBASE_ENABLED){
        db.collection('settings').doc('houseImages').set({[houseId]: dataUrl}, {merge:true})
          .then(()=> toast('✔ '+h.name+' crest updated — synced to every device.'))
          .catch(err=> toast('⚠ Sync error: '+err.message));
      } else {
        toast('✔ '+h.name+' crest updated (local demo mode).');
      }
      render();
    };
    reader.readAsDataURL(file);
  },
  importRoster(file){
    if(!file) return;
    const statusEl = document.getElementById('importStatus');
    if(statusEl) statusEl.textContent = 'Reading file…';
    const reader = new FileReader();
    reader.onload = (e)=>{
      try{
        const data = new Uint8Array(e.target.result);
        const wb = XLSX.read(data, {type:'array'});
        const rows = XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]], {defval:null});
        const scholars = importRowsToScholars(rows);
        if(!scholars.length){ if(statusEl) statusEl.textContent='No recognizable scholar rows found in that file.'; return; }
        if(!confirm('Import '+scholars.length+' scholars and replace the current roster of '+SCHOLARS.length+'? This cannot be undone.')){
          if(statusEl) statusEl.textContent='Import cancelled.'; return;
        }
        const missingBarcode = scholars.filter(s=>!s.barcodeId).length;
        const unsorted = scholars.filter(s=>!s.houseId).length;
        const summary = 'Imported '+scholars.length+' scholars ('+missingBarcode+' missing a barcode ID, '+unsorted+' not yet sorted into a House).';
        if(FIREBASE_ENABLED){
          if(statusEl) statusEl.textContent='Uploading to shared database…';
          const chunks=[]; for(let i=0;i<scholars.length;i+=450) chunks.push(scholars.slice(i,i+450));
          (async()=>{
            for(const chunk of chunks){
              const batch = db.batch();
              chunk.forEach(s=> batch.set(db.collection('scholars').doc(s.id), s));
              await batch.commit();
            }
            toast('✔ '+summary);
          })().catch(err=>{ if(statusEl) statusEl.textContent='Import failed: '+err.message; });
        } else {
          SCHOLARS = scholars; TRANSACTIONS=[];
          toast('✔ '+summary);
          render();
        }
      }catch(err){
        if(statusEl) statusEl.textContent='Could not read that file: '+err.message;
      }
    };
    reader.readAsArrayBuffer(file);
  }
};

/* Basic camera preview (visual scan surface). Wiring a real decode library
   like @zxing/browser is a one-line addition in the production build —
   noted in BLUEPRINT.md. */
let camStream=null;
function startCamera(videoId){
  const v=document.getElementById(videoId);
  if(!v || camStream) return;
  navigator.mediaDevices?.getUserMedia({video:{facingMode:'environment'}}).then(stream=>{
    camStream=stream; v.srcObject=stream;
  }).catch(()=>{ toast('Camera unavailable in this browser/context.'); state.camOpen=false; state.globalCamOpen=false; render(); });
}
function stopCamera(){ if(camStream){ camStream.getTracks().forEach(t=>t.stop()); camStream=null; } }
document.addEventListener('visibilitychange',()=>{ if(document.hidden && camStream){ stopCamera(); }});

/* ============================= FIREBASE LIVE SYNC BOOTSTRAP ============================= */
function startFirebaseSync(){
  const scholarsRef = db.collection('scholars');
  const txRef = db.collection('transactions').orderBy('ts','desc').limit(300);

  scholarsRef.get().then(snap=>{
    if(snap.empty){
      // First run ever: seed Firestore with the starter roster so every device shares it.
      const seed = buildSeedScholars();
      const batch = db.batch();
      seed.forEach(s=> batch.set(scholarsRef.doc(s.id), s));
      return batch.commit();
    }
  }).catch(err=> toast('⚠ Could not reach Firebase: '+err.message))
    .finally(()=>{
      scholarsRef.onSnapshot(snap=>{
        SCHOLARS = snap.docs.map(d=>d.data());
        SYNC_READY = true;
        render();
      }, err=> toast('⚠ Sync error: '+err.message));

      txRef.onSnapshot(snap=>{
        TRANSACTIONS = snap.docs.map(d=>d.data());
        render();
      }, err=> toast('⚠ Sync error: '+err.message));

      db.collection('settings').doc('houseImages').onSnapshot(doc=>{
        if(doc.exists){
          const data = doc.data();
          HOUSES.forEach(h=>{ if(data[h.id]) h.crestImage = data[h.id]; });
          render();
        }
      }, ()=>{ /* settings doc may not exist yet — fine, houses just use default mascots */ });
    });
}

/* ============================= STAFF LOGIN BOOTSTRAP ============================= */
function startAuthListener(){
  firebase.auth().onAuthStateChanged(user=>{
    state.authChecking = false;
    if(!user){
      state.authUser=null; state.staffProfile=null; state.loginPassword='';
      render();
      return;
    }
    state.authUser = user;
    db.collection('staff').doc(user.uid).get().then(doc=>{
      if(!doc.exists){
        state.authError = 'Your account is not set up yet. Ask your administrator to add you in the "staff" collection.';
        firebase.auth().signOut(); // this will re-trigger the listener with user=null
        return;
      }
      const profile = doc.data();
      state.staffProfile = profile;
      state.role = profile.role || 'teacher';
      state.tab = state.role==='student' ? 'scan' : 'dashboard';
      state.authError = null;
      render();
    }).catch(err=>{
      state.authError = 'Could not load your staff profile: ' + err.message;
      firebase.auth().signOut();
    });
  });
}

if(FIREBASE_ENABLED){
  render(); // show "Checking sign-in status…" immediately
  startAuthListener();
  startFirebaseSync();
} else {
  render();
}
